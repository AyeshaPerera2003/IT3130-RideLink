spring.application.name=fare-payment-service


server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:h2:mem:ridelink_payments
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fare calculation rates (LKR). total = (base + distanceKm * per-km + durationMinutes * per-minute) * surge
fare.base=150.00
fare.per-km=50.00
fare.per-minute=5.00
fare.surge-multiplier=1.00
fare.currency=LKR
