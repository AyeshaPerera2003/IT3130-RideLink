spring.application.name=driver-service
# Server Port (Set to 8082 to avoid conflicts with other services)
server.port=8082

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:driverdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate & DDL Auto (For automatic table generation)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (To view the database from the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Endpoints (For monitoring)
management.endpoints.web.exposure.include=*